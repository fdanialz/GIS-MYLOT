<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <style>
      .jupem-teal { fill: #007a78; }
      .jupem-orange { fill: #f97316; }
      .jupem-white { fill: #ffffff; }
      .jupem-silver { fill: #94a3b8; }
    </style>
  </defs>

  <!-- Globe Background (Teal Circle) -->
  <circle cx="100" cy="90" r="65" class="jupem-teal" />

  <!-- Grid Dots on Globe (White & Orange) -->
  <!-- Row 1 -->
  <circle cx="75" cy="55" r="5" class="jupem-white" />
  <circle cx="95" cy="55" r="5" class="jupem-orange" />
  <circle cx="115" cy="55" r="5" class="jupem-white" />

  <!-- Row 2 -->
  <circle cx="65" cy="72" r="5" class="jupem-orange" />
  <circle cx="85" cy="72" r="5" class="jupem-white" />
  <circle cx="105" cy="72" r="5" class="jupem-white" />
  <circle cx="125" cy="72" r="5" class="jupem-orange" />

  <!-- Row 3 -->
  <circle cx="75" cy="90" r="5" class="jupem-white" />
  <circle cx="95" cy="90" r="5" class="jupem-teal" />
  <circle cx="115" cy="90" r="5" class="jupem-white" />

  <!-- Row 4 -->
  <circle cx="85" cy="108" r="5" class="jupem-orange" />
  <circle cx="105" cy="108" r="5" class="jupem-teal" />

  <!-- Orbital Silver Ring / Ellipse Swoosh -->
  <path d="M 30,135 C 70,110 145,50 180,75 C 190,82 170,115 110,135 C 65,150 20,145 30,135 Z" 
        fill="none" stroke="#b0b7c0" stroke-width="9" stroke-linecap="round" />
  <path d="M 32,137 C 75,112 148,52 178,77 C 185,82 168,112 112,133 C 70,147 25,143 32,137 Z" 
        fill="#ffffff" />

  <!-- JUPEM Bold Typography -->
  <text x="100" y="215" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" class="jupem-teal" text-anchor="middle" letter-spacing="1">JUPEM</text>
</svg>
